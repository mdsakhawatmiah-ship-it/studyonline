const classSelect=document.getElementById("classSelect");
const subjectSelect=document.getElementById("subjectSelect");
const chapterSelect=document.getElementById("chapterSelect");
const lessonSelect=document.getElementById("lessonSelect");
const chapterInfo=document.getElementById("chapterInfo");
const contentArea=document.getElementById("contentArea");

function resetSelect(el,text,disabled=true){el.innerHTML=`<option value="">${text}</option>`;el.disabled=disabled}
function showContent(ch,l){
 if(!ch||!l){contentArea.innerHTML="";return}
 const chapterIndex=ch.subjectIndex;
 const isFree=chapterIndex===0;
 if(!isFree){
  contentArea.innerHTML=`<div class="paid-box"><h2>🔒 এই অধ্যায়টি Paid</h2><p>এই অধ্যায়ের সকল পাঠ দেখতে ৳১০ প্রদান করে অ্যাক্সেস নিতে হবে।</p><a class="buy" href="${BUY_URL}" target="_blank">অ্যাক্সেস কিনুন — ৳১০</a></div>`;
 }else{
  contentArea.innerHTML=`<div class="content"><h2>${l}</h2><div class="empty">শীঘ্রই কনটেন্ট আপডেট করা হবে।</div></div>`;
 }
}

studyData.forEach(c=>classSelect.add(new Option(c.name,c.id)));

classSelect.addEventListener("change",()=>{
 const c=studyData.find(x=>x.id===classSelect.value);
 resetSelect(subjectSelect,"-- বিষয় নির্বাচন করুন --",!c);
 resetSelect(chapterSelect,"-- অধ্যায় নির্বাচন করুন --",true);
 resetSelect(lessonSelect,"-- পাঠ নির্বাচন করুন --",true);
 chapterInfo.innerHTML="";contentArea.innerHTML="";
 if(c)c.subjects.forEach(s=>subjectSelect.add(new Option(s.name,s.id)));
});

subjectSelect.addEventListener("change",()=>{
 const c=studyData.find(x=>x.id===classSelect.value);
 const s=c?.subjects.find(x=>x.id===subjectSelect.value);
 resetSelect(chapterSelect,"-- অধ্যায় নির্বাচন করুন --",!s);
 resetSelect(lessonSelect,"-- পাঠ নির্বাচন করুন --",true);
 chapterInfo.innerHTML="";contentArea.innerHTML="";
 if(s)s.chapters.forEach((ch,i)=>{
  ch.subjectIndex=i;
  const opt=new Option(`${ch.title} ${i===0?"— FREE":"— ৳১০"}`,ch.id);
  chapterSelect.add(opt);
 });
});

chapterSelect.addEventListener("change",()=>{
 const c=studyData.find(x=>x.id===classSelect.value);
 const s=c?.subjects.find(x=>x.id===subjectSelect.value);
 const ch=s?.chapters.find(x=>x.id===chapterSelect.value);
 resetSelect(lessonSelect,"-- পাঠ নির্বাচন করুন --",!ch);
 contentArea.innerHTML="";
 if(!ch){chapterInfo.innerHTML="";return}
 const free=ch.subjectIndex===0;
 chapterInfo.innerHTML=`<div class="card info"><div class="chapter-title">${ch.title} <span class="badge ${free?"free-badge":"paid-badge"}">${free?"FREE":"PAID — ৳১০"}</span></div><div>এই অধ্যায়ে ${ch.lessons.length}টি পাঠ রয়েছে।</div></div>`;
 ch.lessons.forEach((l,i)=>lessonSelect.add(new Option(`${i+1}. ${l}`,i)));
});

lessonSelect.addEventListener("change",()=>{
 const c=studyData.find(x=>x.id===classSelect.value);
 const s=c?.subjects.find(x=>x.id===subjectSelect.value);
 const ch=s?.chapters.find(x=>x.id===chapterSelect.value);
 const l=ch?.lessons[Number(lessonSelect.value)];
 showContent(ch,l);
});
</script>
